# AgentLens pricing table: USD per 1 million tokens (input = prompt, output = completion).
#
# APPROXIMATE list prices, last checked 2026-11-13. Providers change prices, add
# discounts (batch, cached input) and bill some models differently, so treat
# `cost_usd` as an estimate for comparing runs, not as an invoice. Check
# https://openai.com/api/pricing and https://www.anthropic.com/pricing for current values.
#
# Override or extend this table with your own YAML file of the same shape, passed as
# `get_client(..., pricing="my-pricing.yaml")` or via the AGENTLENS_PRICING env var;
# its entries are merged over these.
#
# Model ids are matched exactly, then via `aliases`, then by the longest key that is a
# prefix followed by "-", ":" or "@" (so "gpt-4o-mini-2024-07-18" uses "gpt-4o-mini" and
# "claude-sonnet-4-5-20250929" uses "claude-sonnet-4-5"). Unknown models get no cost
# (cost_usd stays null: unknown is not free).

updated: "2026-11-13"

# Local / self-hosted servers: every model costs 0.
free_providers: [ollama, vllm, lmstudio, mock]

models:
  # --- OpenAI ---------------------------------------------------------------
  gpt-5: {input: 1.25, output: 10.00}
  gpt-5-mini: {input: 0.25, output: 2.00}
  gpt-5-nano: {input: 0.05, output: 0.40}
  gpt-4.1: {input: 2.00, output: 8.00}
  gpt-4.1-mini: {input: 0.40, output: 1.60}
  gpt-4.1-nano: {input: 0.10, output: 0.40}
  gpt-4o: {input: 2.50, output: 10.00}
  gpt-4o-mini: {input: 0.15, output: 0.60}
  gpt-4-turbo: {input: 10.00, output: 30.00}
  gpt-4: {input: 30.00, output: 60.00}
  gpt-3.5-turbo: {input: 0.50, output: 1.50}
  o1: {input: 15.00, output: 60.00}
  o1-mini: {input: 1.10, output: 4.40}
  o3: {input: 2.00, output: 8.00}
  o3-mini: {input: 1.10, output: 4.40}
  o4-mini: {input: 1.10, output: 4.40}

  # --- Anthropic ------------------------------------------------------------
  claude-opus-4-5: {input: 5.00, output: 25.00}
  claude-opus-4-1: {input: 15.00, output: 75.00}
  claude-opus-4: {input: 15.00, output: 75.00}
  claude-sonnet-4-5: {input: 3.00, output: 15.00}
  claude-sonnet-4: {input: 3.00, output: 15.00}
  claude-haiku-4-5: {input: 1.00, output: 5.00}
  claude-3-7-sonnet: {input: 3.00, output: 15.00}
  claude-3-5-sonnet: {input: 3.00, output: 15.00}
  claude-3-5-haiku: {input: 0.80, output: 4.00}
  claude-3-opus: {input: 15.00, output: 75.00}
  claude-3-haiku: {input: 0.25, output: 1.25}

# Ids that do not share a prefix with their priced model.
aliases:
  chatgpt-4o-latest: gpt-4o
