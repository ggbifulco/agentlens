[project]
name = "agentlens"
dynamic = ["version", "readme"]
description = "Regression testing and evaluation toolkit for LLM agents: record, replay, evaluate, compare."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Giuseppe Bifulco" }]
keywords = [
    "llm",
    "agents",
    "evaluation",
    "evals",
    "regression-testing",
    "tracing",
    "llm-as-judge",
    "replay",
    "pytest",
    "opentelemetry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "jsonschema>=4.18",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.15",
]

[project.scripts]
agentlens = "agentlens.cli:app"

[project.entry-points.pytest11]
agentlens = "agentlens.integrations.pytest_plugin"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.urls]
Homepage = "https://ggbifulco.github.io/agentlens/"
Documentation = "https://ggbifulco.github.io/agentlens/"
Repository = "https://github.com/ggbifulco/agentlens"
Changelog = "https://github.com/ggbifulco/agentlens/blob/main/CHANGELOG.md"
Issues = "https://github.com/ggbifulco/agentlens/issues"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "pre-commit>=4.0",
    "respx>=0.21",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.18",
    "opentelemetry-sdk>=1.27",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["hatchling>=1.26", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agentlens/__init__.py"

# PyPI long description = README.md with relative links made absolute (PyPI cannot resolve
# repository paths): images point at raw files, every other path at the file on GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/ggbifulco/agentlens/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/ggbifulco/agentlens/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/agentlens"]

# --- ruff -----------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Design docs contain illustrative pseudo-code, not formatted Python.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
    "PT",       # flake8-pytest-style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# --- mypy -----------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest / coverage ----------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `-p no:agentlens`: our own pytest plugin (entry point) would import `agentlens` before
# coverage starts, hiding every module-level line; its tests load it in pytester runs.
addopts = [
    "-ra", "--strict-markers", "--strict-config", "-p", "no:agentlens",
    "--cov=agentlens", "--cov-report=term-missing",
]
markers = [
    "live: tests that call real LLM providers (need API keys; skipped by default)",
]

[tool.coverage.run]
branch = true
source = ["agentlens"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
